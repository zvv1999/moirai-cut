name: Bun CI

permissions:
  contents: read

concurrency:
  group: bun-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      DATABASE_URL: "postgresql://opencut:opencut@localhost:5432/opencut"
      BETTER_AUTH_SECRET: "supersecret"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      UPSTASH_REDIS_REST_URL: "https://your-upstash-redis-url"
      UPSTASH_REDIS_REST_TOKEN: "your-upstash-redis-token"
      NEXT_PUBLIC_MARBLE_API_URL: "https://placeholder.example.com"
      MARBLE_WORKSPACE_KEY: "placeholder"
      FREESOUND_CLIENT_ID: "placeholder"
      FREESOUND_API_KEY: "placeholder"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-1.93.1-wasm-pack-0.14.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.93.1-wasm-pack-0.14.0-

      - name: Install wasm-pack
        run: cargo install --locked wasm-pack --version 0.14.0

      - name: Build WASM
        run: wasm-pack build rust/wasm --target bundler --out-dir pkg

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Test Rust interchange
        run: cargo test -p interchange --all-targets

      - name: Lint Rust interchange
        run: cargo clippy -p interchange --all-targets -- -D warnings

      - name: Test Rust footage
        run: cargo test -p moirai-footage --all-targets

      - name: Lint Rust footage
        run: cargo clippy -p moirai-footage --all-targets -- -D warnings

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run audit:release

      - name: Validate public release surface
        run: bun run release:check

      - name: Typecheck
        run: bun run typecheck:web

      - name: Lint
        run: bun run lint:web

      # The agent layer and the MCP server are gated strictly: they are the
      # contract external callers depend on, and the drift guard is worthless
      # if it never executes.
      - name: Run agent tests
        run: bun test apps/web/src/agent apps/web/src/core apps/web/src/server apps/web/src/components/editor/__tests__

      - name: Run MCP server tests
        run: bun run test:mcp

      - name: Run full suite
        run: bun test

      - name: Build
        env:
          NODE_ENV: production
        run: bun run build:web

      - name: Smoke-test production FCPXML handoff image
        if: runner.os == 'Linux'
        run: sh scripts/ci/interchange-docker-http-smoke.sh
