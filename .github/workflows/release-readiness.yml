name: Release readiness

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate public tree
        run: bun run release:check

      - name: Generate source archive and checksum
        run: bun run release:source

      - name: Generate CycloneDX SBOM
        run: bun run release:sbom

      - name: Record dependency audit
        run: bun audit --json > artifacts/sbom/bun-audit.json

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: moirai-cut-release-evidence-${{ github.ref_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
